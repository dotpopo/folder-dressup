name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（例如 v1.0.0）
        required: true
        default: v1.0.0

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --release

      - name: Linux 使用 ASCII 包名（deb/AppImage 命名要求）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.productName='FolderDressup';c.bundle.targets=['appimage','deb'];fs.writeFileSync(p,JSON.stringify(c,null,2));"
          grep -m1 productName src-tauri/tauri.conf.json

      - name: 构建
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: 文件夹换装 v1.0.0
          draft: true
          fail_on_unmatched_files: false
          body: |
            跨平台构建：Windows（NSIS / MSI）、macOS（dmg，universal）、Linux（AppImage / deb）。

            | 平台 | 换图标的机制 |
            |---|---|
            | Windows | `desktop.ini` + 隐藏 `.ico` + 文件属性，`SHChangeNotify` 立即刷新 |
            | macOS | `NSWorkspace.setIcon` 写入文件夹自定义图标 |
            | Linux | 文件夹内 `.directory` 指向 PNG（GNOME/KDE/Thunar 均识别） |

            皮肤包目录：`%APPDATA%\文件夹换装\packs`（Windows）、`~/.local/share/文件夹换装/packs`（Linux）、`~/Library/Application Support/文件夹换装/packs`（macOS）。
          files: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
